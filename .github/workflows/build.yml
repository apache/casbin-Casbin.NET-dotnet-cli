name: Build    
    
on: [push, pull_request]    
    
jobs:    
  test:    
    runs-on: ubuntu-latest    
    strategy:    
      matrix:    
        dotnet: ['8.0']    
    steps:    
      - uses: actions/checkout@v4    
      - name: Setup .NET    
        uses: actions/setup-dotnet@v4    
        with:    
          dotnet-version: ${{ matrix.dotnet }}    
          dotnet-quality: 'ga'    
      - name: Restore dependencies    
        run: dotnet restore    
      - name: Build    
        run: dotnet build --no-restore    
      - name: Run tests    
        run: dotnet test --no-build --verbosity normal    
  
  build-binaries:  
    needs: test  
    runs-on: ${{ matrix.os }}  
    strategy:  
      matrix:  
        include:  
          - os: ubuntu-latest  
            platform: linux-x64  
            output_name: linux-x86_64  
            executable_name: casbin  
          - os: ubuntu-latest    
            platform: linux-arm64  
            output_name: linux-arm64  
            executable_name: casbin  
          - os: windows-latest  
            platform: win-x64  
            output_name: windows-x86_64.exe  
            executable_name: casbin.exe  
          - os: windows-latest  
            platform: win-arm64    
            output_name: windows-arm64.exe  
            executable_name: casbin.exe  
          - os: macos-latest  
            platform: osx-x64  
            output_name: darwin-x86_64  
            executable_name: casbin  
          - os: macos-latest  
            platform: osx-arm64  
            output_name: darwin-arm64  
            executable_name: casbin  
  
    steps:  
      - uses: actions/checkout@v4  
      - name: Setup .NET  
        uses: actions/setup-dotnet@v4  
        with:  
          dotnet-version: '8.0'  
          dotnet-quality: 'ga'  
            
      - name: Build binary  
        run: |  
          dotnet publish src/CasbinCli/CasbinCli.csproj -c Release -r ${{ matrix.platform }} --self-contained true -p:PublishSingleFile=true -o "dist/${{ matrix.platform }}"  
            
      - name: Copy and rename binary (Windows)  
        if: runner.os == 'Windows'  
        run: |  
          New-Item -ItemType Directory -Force -Path "dist"  
          $targetName = "casbin-dotnet-cli-${{ matrix.output_name }}"  
          Copy-Item "dist/${{ matrix.platform }}/${{ matrix.executable_name }}" "dist/$targetName"  
        shell: pwsh  
            
      - name: Copy and rename binary (Unix)  
        if: runner.os != 'Windows'  
        run: |  
          mkdir -p dist  
          target_name="casbin-dotnet-cli-${{ matrix.output_name }}"  
          cp "dist/${{ matrix.platform }}/${{ matrix.executable_name }}" "dist/$target_name"  
        shell: bash  
            
      - name: Upload artifacts  
        uses: actions/upload-artifact@v4  
        with:  
          name: binaries-${{ matrix.platform }}  
          path: dist/casbin-dotnet-cli-${{ matrix.output_name }}  
  
  # Releases are cut by hand: nothing here runs on a merge, only on a pushed tag.
  #
  #   v1.4.0-rc1  ->  GitHub pre-release (the candidate put up for the Apache vote)
  #   v1.4.0      ->  GitHub release
  #
  # Either way the release carries an Apache-style source tarball plus the CLI
  # binaries built above. The release manager downloads the tarball and signs /
  # checksums it locally before starting the vote; nothing is signed here.
  release:
    needs: [test, build-binaries]
    if: github.repository == 'apache/casbin-Casbin.NET-dotnet-cli' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Base name of the source release artifact, per Apache naming conventions.
      ARTIFACT_BASENAME: apache-casbin-dotnet-cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # v1.4.0-rc1 -> 1.4.0. The tarball the PPMC votes on is the exact tarball
          # that ships, so the candidate counter is never part of its name.
          BASE_VERSION="${VERSION%%-rc*}"
          if [ "$VERSION" = "$BASE_VERSION" ]; then
            PRERELEASE=false
          else
            PRERELEASE=true
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$'; then
            echo "::error::Tag $GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-rcN."
            exit 1
          fi
          {
            echo "base_version=$BASE_VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Tag $GITHUB_REF_NAME -> version $BASE_VERSION (pre-release: $PRERELEASE)"

      - name: Build source release tarball
        id: package
        run: |
          set -euo pipefail
          NAME="${ARTIFACT_BASENAME}-${{ steps.version.outputs.base_version }}-incubating-src"
          ASSET="${RUNNER_TEMP}/${NAME}.tar.gz"
          # git archive gives us exactly the tracked sources at this tag, unpacking
          # into a single top-level directory named after the release.
          git archive --format=tar.gz --prefix="$NAME/" -o "$ASSET" HEAD
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          ls -l "$ASSET"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move binaries to dist
        run: |
          mkdir -p dist
          find artifacts -name "casbin-dotnet-cli-*" -type f -exec cp {} dist/ \;
          ls -la dist/

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ steps.package.outputs.asset }}
        run: |
          set -euo pipefail
          FLAGS=(--title "$TAG" --generate-notes)
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" "$ASSET" dist/casbin-dotnet-cli-* "${FLAGS[@]}"
